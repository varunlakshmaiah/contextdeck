<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContextDeck</title>
<style>
	:root { --bg: #ffffff; --fg: #18181b; --muted: #71717a; --line: #e4e4e7; --accent: #f97316; --ok: #16a34a; --bad: #dc2626; color-scheme: light dark; }
	@media (prefers-color-scheme: dark) { :root { --bg: #111113; --fg: #f4f4f5; --muted: #a1a1aa; --line: #27272a; } }
	body { background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 24px 16px; }
	main { max-width: 520px; margin: 0 auto; }
	h1 { font-size: 18px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
	p { color: var(--muted); margin: 0 0 16px; }
	.card { border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
	button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
	button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
	label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
	input[type=text], input[type=password], input[type=number] { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
	.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
	#status { font-weight: 600; }
	#status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
	details summary { cursor: pointer; color: var(--muted); }
</style>
</head>
<body>
<main>
	<h1>ContextDeck</h1>
	<p>Lets your Stream Deck see which website you're on. The URL and title of the tab in front go to the ContextDeck plugin on this computer (127.0.0.1) and nowhere else.</p>
	<div class="card">
		<div class="row"><span>Status:</span> <span id="status">…</span></div>
		<p style="margin-top:12px">Press <b>Connect</b>, then press <b>Allow</b> on your Stream Deck.</p>
		<div class="row"><button id="pair">Connect</button><span id="pairMsg"></span></div>
	</div>
	<div class="card">
		<label><input type="checkbox" id="skipIncognito"> Don't share private/incognito tabs</label>
		<details>
			<summary>Advanced</summary>
			<label for="token">Token (from ~/.contextdeck/token)</label>
			<input type="password" id="token" autocomplete="off">
			<label for="port">Port</label>
			<input type="number" id="port" placeholder="47811">
			<div class="row" style="margin-top:12px"><button class="secondary" id="save">Save</button></div>
		</details>
	</div>
</main>
<script src="options.js"></script>
</body>
</html>
